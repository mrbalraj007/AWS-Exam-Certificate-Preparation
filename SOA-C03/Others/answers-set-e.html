<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SOA-C03 Set E Results</title><style>
:root{--nav:#111827;--orange:#ff9900;--bg:#eef1f5;--card:#fff;--text:#182230;--muted:#667085;--line:#d0d5dd;--blue:#2563eb;--green:#16803d;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Segoe UI,sans-serif}
header{background:var(--nav);color:white;position:sticky;top:0;z-index:5;padding:12px 20px}
.hrow{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:18px;font-weight:800}.brand b{color:var(--orange)}.hstats{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.chip{border:1px solid #ffffff30;padding:7px 10px;border-radius:6px;font-size:13px}.timer{font-weight:800;font-variant-numeric:tabular-nums;color:#ffd28a}
main{max-width:1200px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:260px 1fr;gap:18px}
aside,.panel{background:white;border:1px solid var(--line);border-radius:8px}.asidein{padding:15px;position:sticky;top:80px}.panel{padding:28px}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-height:430px;overflow:auto}.qn{padding:7px 2px;border:1px solid var(--line);background:white;border-radius:4px;cursor:pointer;font-size:12px}.qn.cur{outline:2px solid var(--orange)}.qn.answered{background:#dbeafe}.qn.flag{border-bottom:4px solid var(--orange)}
.domain{font-size:12px;font-weight:700;color:#92400e;background:#fff7ed;padding:5px 8px;border-radius:4px;display:inline-block}.question{font-size:19px;line-height:1.55;margin:18px 0}.instruction{font-weight:700;font-size:13px;color:#475467}
.opt{display:flex;gap:10px;padding:13px;border:1px solid var(--line);border-radius:6px;margin:9px 0;cursor:pointer;line-height:1.45}.opt:hover{background:#f9fafb}.letter{font-weight:bold;min-width:20px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:5px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#1f2937;color:white}.light{background:#e5e7eb;color:#111827}.orange{background:#f59e0b;color:#111827}.red{background:#b42318;color:white}
.small{font-size:12px;color:var(--muted);line-height:1.5}.progress{height:8px;background:#374151;border-radius:8px;overflow:hidden;width:150px}.progress div{height:100%;background:var(--orange)}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:white;max-width:650px;width:100%;padding:25px;border-radius:8px}
.reviewitem{background:white;border:1px solid var(--line);border-radius:8px;padding:20px;margin:14px 0}.good{color:var(--green);font-weight:800}.bad{color:var(--red);font-weight:800}.explain{background:#f8fafc;border-left:4px solid #64748b;padding:12px;margin-top:10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px}
@media(max-width:800px){main{grid-template-columns:1fr}.asidein{position:static}.qgrid{grid-template-columns:repeat(10,1fr);max-height:none}}
</style></head><body>
<header><div class=hrow><div class=brand>AWS <b>SOA-C03</b> Set E — Results & Review</div><div><a class="btn orange" href="mock-set-e.html">Back to exam</a></div></div></header>
<main style="display:block;max-width:1000px"><section class=panel><div id=score></div><div id=domains></div><div class=actions><button class="btn red" onclick=reset()>Reset Set E</button></div><p class=small>All questions are original practice material written to the SOA-C03 blueprint; they are not leaked AWS exam questions.</p></section><div id=items></div></main>
<script>const QUESTION_BANK=[{"id": 1, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A payment API runs on EC2 behind an ALB. During an incident, ALB TargetResponseTime rises from 120 ms to 4 seconds. EC2 CPU remains below 30%, while RDS DatabaseConnections reaches 95% of the configured maximum. Which action should the CloudOps engineer take FIRST?", "choices": ["Replace the ALB with an NLB", "Use RDS performance tooling to identify database waits and connection pressure", "Increase the ASG minimum capacity", "Increase the EC2 CPU alarm threshold"], "answers": ["B"], "explanation": "The strongest evidence points to the database tier. Investigate database waits, SQL, and connection pressure before scaling an unconstrained EC2 tier.", "tip": "Follow the saturated metric. Low EC2 CPU is a clue not to scale EC2 first.", "multi": false}, {"id": 2, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A Linux application writes authentication failures to /var/log/secure. Operations wants a CloudWatch alarm when more than 20 matching failures occur in 5 minutes. Which solution requires the LEAST custom code?", "choices": ["AWS Config custom rule", "CloudTrail data events → EventBridge", "VPC Flow Logs → Athena only", "CloudWatch agent → CloudWatch Logs → metric filter → CloudWatch alarm"], "answers": ["D"], "explanation": "The agent can ship the file, a metric filter converts matching log events into a metric, and an alarm evaluates the threshold.", "tip": "Log pattern → metric filter → alarm is a common operations pattern.", "multi": false}, {"id": 3, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "An operations team must identify the IAM identity that terminated an EC2 instance at a specific time. Which data source provides the MOST direct evidence?", "choices": ["CloudTrail event history", "CloudWatch Metrics", "VPC Flow Logs", "EC2 status checks"], "answers": ["A"], "explanation": "CloudTrail records control-plane API activity, including the caller identity, action, time, and request details.", "tip": "Who performed an AWS API action? Think CloudTrail.", "multi": false}, {"id": 4, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A fleet of Windows and Linux EC2 instances must report memory utilization, disk-used percentage, and application log files. Which TWO actions are required?", "choices": ["Install/configure the CloudWatch agent", "Grant the instances an appropriate IAM role for CloudWatch/Logs access", "Enable EC2 detailed monitoring only", "Enable S3 Versioning", "Create a Route 53 health check"], "answers": ["A", "B"], "explanation": "Guest OS metrics and log files require an agent, and the agent needs IAM authorization to publish data.", "tip": "Detailed monitoring changes EC2 metric frequency; it does not magically collect guest memory/disk/logs.", "multi": true}, {"id": 5, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A CloudWatch alarm for application errors enters ALARM. The company wants a predefined multi-step remediation runbook to execute automatically without maintaining a Lambda function. Which architecture is BEST?", "choices": ["AWS Config → CloudFront → Session Manager", "CloudWatch alarm state change → EventBridge → Systems Manager Automation", "CloudTrail → NAT Gateway → Step Functions", "CloudWatch alarm → Internet Gateway → Run Command"], "answers": ["B"], "explanation": "EventBridge can react to alarm state changes and invoke an SSM Automation workflow for managed remediation.", "tip": "Event → EventBridge; operational runbook → SSM Automation.", "multi": false}, {"id": 6, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A team needs to calculate and alarm on the percentage of ALB 5xx responses relative to total requests by using existing CloudWatch metrics. Which feature should be used?", "choices": ["CloudTrail Insights", "Contributor Insights", "Metric math", "AWS Config advanced query"], "answers": ["C"], "explanation": "Metric math creates expressions such as errors/requests*100 from existing metrics and can be alarmed on.", "tip": "Derived value from existing metrics = metric math.", "multi": false}, {"id": 7, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A service has a daily traffic pattern that changes over time. The team wants CloudWatch to detect unusual latency without maintaining a fixed threshold. Which feature is BEST?", "choices": ["A static 500-ms alarm", "S3 Inventory", "AWS Config", "CloudWatch anomaly detection"], "answers": ["D"], "explanation": "Anomaly detection models expected metric behavior and provides dynamic bands.", "tip": "Changing baseline + abnormal deviation = anomaly detection.", "multi": false}, {"id": 8, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "An engineer needs to identify the top client IP addresses responsible for a sudden increase in rejected requests from structured log data. Which CloudWatch feature is designed for this?", "choices": ["Synthetics", "Metric Streams", "Contributor Insights", "Application Signals"], "answers": ["C"], "explanation": "Contributor Insights identifies top contributors from logs/time-series data.", "tip": "Top talkers/top contributors = Contributor Insights.", "multi": false}, {"id": 9, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A public checkout endpoint must be tested every 5 minutes even when no real customers are using it. The test must execute several HTTP steps and report latency and failure. Which service is MOST appropriate?", "choices": ["CloudWatch Synthetics canaries", "CloudWatch Logs Insights", "CloudTrail Lake", "AWS Config"], "answers": ["A"], "explanation": "Synthetics runs scheduled scripted journeys independent of real user traffic.", "tip": "Synthetic user/API journey = Synthetics.", "multi": false}, {"id": 10, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A microservices platform wants service maps, latency/fault visibility, dependencies, and service-level objectives using CloudWatch's application monitoring capabilities. Which feature is the BEST match?", "choices": ["VPC Flow Logs", "CloudWatch Application Signals", "CloudTrail event history", "CloudWatch Synthetics only"], "answers": ["B"], "explanation": "Application Signals is designed for application/service health, dependencies, telemetry, and SLO-oriented monitoring.", "tip": "Service health/dependencies/SLO = Application Signals.", "multi": false}, {"id": 11, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "An operations team needs to run interactive queries over CloudWatch Logs to find requests with status=500, group by service, and calculate latency percentiles. Which capability should be used?", "choices": ["AWS Config", "CloudWatch alarm actions", "CloudTrail Insights", "CloudWatch Logs Insights"], "answers": ["D"], "explanation": "Logs Insights provides interactive filtering, parsing, aggregation, and statistical queries over CloudWatch Logs.", "tip": "Query and aggregate logs = Logs Insights.", "multi": false}, {"id": 12, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A network incident requires records containing source IP, destination IP, ports, protocol, and ACCEPT/REJECT information for VPC traffic. Which feature should be enabled?", "choices": ["CloudTrail management events", "S3 server access logging only", "AWS Config", "VPC Flow Logs"], "answers": ["D"], "explanation": "VPC Flow Logs capture network-flow metadata for supported VPC resources.", "tip": "Network flow metadata and ACCEPT/REJECT = VPC Flow Logs.", "multi": false}, {"id": 13, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "Before changing any firewall rules, an engineer wants AWS to analyze whether a network path from an EC2 ENI to another endpoint is reachable and identify the component blocking the path. Which service is MOST appropriate?", "choices": ["CloudTrail", "AWS Inspector", "VPC Reachability Analyzer", "CloudWatch Synthetics"], "answers": ["C"], "explanation": "Reachability Analyzer evaluates network configuration rather than sending packets and identifies blocking components.", "tip": "Static path analysis = Reachability Analyzer.", "multi": false}, {"id": 14, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A gp3 EBS volume shows throughput consistently at its provisioned limit, while IOPS is well below the provisioned value. The application performs large sequential I/O. What is the MOST targeted change?", "choices": ["Increase EC2 CPU alarm threshold", "Enable EBS encryption", "Increase gp3 throughput", "Increase gp3 IOPS only"], "answers": ["C"], "explanation": "The observed bottleneck is throughput, and gp3 permits independent performance provisioning within limits.", "tip": "Tune the dimension that is saturated.", "multi": false}, {"id": 15, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A company needs near-real-time delivery of CloudWatch metrics to an external monitoring platform without repeatedly polling GetMetricData. Which feature should it use?", "choices": ["CloudTrail Lake", "CloudWatch Metric Streams", "CloudWatch Synthetics", "AWS Config aggregator"], "answers": ["B"], "explanation": "Metric Streams continuously send metric data to supported delivery destinations.", "tip": "Continuous metric export = Metric Streams.", "multi": false}, {"id": 16, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A company wants an alarm only when BOTH high CPU and high request latency alarms are in ALARM. Which feature minimizes custom logic?", "choices": ["Systems Manager Inventory", "CloudTrail Insight", "CloudWatch metric stream", "CloudWatch composite alarm"], "answers": ["D"], "explanation": "Composite alarms combine other alarm states with Boolean logic.", "tip": "Combine alarm states = composite alarm.", "multi": false}, {"id": 17, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A metric alarm should enter ALARM when at least 3 of the last 5 one-minute datapoints breach a threshold. Which configuration is correct?", "choices": ["EvaluationPeriods=5 and DatapointsToAlarm=3", "TreatMissingData=ignore only", "EvaluationPeriods=3 and DatapointsToAlarm=5", "Period=5 seconds only"], "answers": ["A"], "explanation": "CloudWatch M-of-N alarm behavior is configured with N evaluation periods and M datapoints to alarm.", "tip": "3 of 5 = DatapointsToAlarm 3, EvaluationPeriods 5.", "multi": false}, {"id": 18, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A CloudWatch alarm frequently changes between OK and ALARM because of one-minute transient spikes. Which adjustment is MOST likely to reduce noise without hiding sustained failures?", "choices": ["Require multiple breaching datapoints across a longer evaluation window", "Delete the metric", "Raise the threshold above any possible value", "Disable the alarm"], "answers": ["A"], "explanation": "Requiring sustained/multiple breaches filters brief spikes while retaining detection of persistent problems.", "tip": "Tune evaluation periods/datapoints before disabling useful alarms.", "multi": false}, {"id": 19, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A company must retain a CloudWatch log group for exactly 365 days and automatically expire older log events. What is the simplest solution?", "choices": ["Use an SCP", "Export every event to EC2 instance store", "Create a monthly Lambda cleanup job", "Set the log group's retention policy to 365 days"], "answers": ["D"], "explanation": "CloudWatch Logs retention policies automatically expire events older than the selected period.", "tip": "Use native retention controls before custom cleanup.", "multi": false}, {"id": 20, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "An S3 security investigation needs audit records for GetObject and DeleteObject calls. The existing trail records management events only. What must be added?", "choices": ["EC2 detailed monitoring", "VPC Reachability Analyzer", "Route 53 query logging", "S3 object-level data events"], "answers": ["D"], "explanation": "S3 object-level API calls are CloudTrail data events.", "tip": "Data-plane object operations require CloudTrail data events.", "multi": false}, {"id": 21, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A company wants to detect unusual spikes in AWS API calls and error rates relative to historical activity. Which capability is designed for this?", "choices": ["EBS Fast Snapshot Restore", "CloudWatch Synthetics", "AWS Config conformance packs", "CloudTrail Insights"], "answers": ["D"], "explanation": "CloudTrail Insights analyzes unusual control-plane API activity patterns.", "tip": "Unusual API-call behavior = CloudTrail Insights.", "multi": false}, {"id": 22, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A team wants AWS-generated EC2 rightsizing recommendations based on CPU, network, and other historical utilization signals. Which service should be checked FIRST?", "choices": ["Route 53", "AWS WAF", "CloudTrail", "AWS Compute Optimizer"], "answers": ["D"], "explanation": "Compute Optimizer provides data-driven rightsizing recommendations for supported resources.", "tip": "Rightsizing recommendation = Compute Optimizer.", "multi": false}, {"id": 23, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "An application has an alarm on a custom business KPI that AWS does not emit. How should the application make the KPI available to CloudWatch?", "choices": ["Add an NACL", "Create a CloudTrail trail", "Enable EC2 detailed monitoring", "Publish a custom metric"], "answers": ["D"], "explanation": "Applications can publish custom metrics to CloudWatch for domain-specific measurements.", "tip": "AWS does not emit it? Publish a custom metric.", "multi": false}, {"id": 24, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A company needs centralized observability of metrics and logs from multiple AWS accounts in a monitoring account. Which approach is MOST appropriate?", "choices": ["Share a root password across accounts", "Copy dashboard screenshots nightly", "Use CloudWatch cross-account observability capabilities", "Peer every VPC only for monitoring"], "answers": ["C"], "explanation": "CloudWatch supports centralized cross-account observability patterns.", "tip": "Multi-account observability should use native cross-account monitoring.", "multi": false}, {"id": 25, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "An ALB's HTTPCode_ELB_5XX_Count is near zero, but HTTPCode_Target_5XX_Count is rising rapidly. Where should the engineer investigate FIRST?", "choices": ["Route 53 hosted zone", "The ALB service itself", "The application targets", "The NAT Gateway"], "answers": ["C"], "explanation": "Target 5XX represents 5xx responses generated by registered targets, unlike ELB 5XX.", "tip": "Target_5XX = backend/application response.", "multi": false}, {"id": 26, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "An EC2 instance shows StatusCheckFailed_System=1 but StatusCheckFailed_Instance=0. Which interpretation is MOST accurate?", "choices": ["The ALB listener is misconfigured", "The issue is likely with underlying AWS infrastructure rather than the guest OS", "The instance definitely has a full root filesystem", "The application password is wrong"], "answers": ["B"], "explanation": "System status checks cover AWS infrastructure hosting the instance; instance status checks focus on the instance OS/network stack.", "tip": "System check vs instance check is a common troubleshooting distinction.", "multi": false}, {"id": 27, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A team wants to correlate a production outage with configuration changes and identify who performed the related API operations. Which TWO sources should be reviewed together?", "choices": ["S3 Transfer Acceleration", "AWS Config resource timeline", "EBS snapshot archive", "CloudFront cache statistics only", "CloudTrail event history"], "answers": ["B", "E"], "explanation": "Config shows resource configuration history; CloudTrail shows API actors/actions.", "tip": "What changed + who changed it = Config + CloudTrail.", "multi": true}, {"id": 28, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A service receives messages through SQS. Users report delayed processing. Which metric is MOST useful for identifying how long the oldest unprocessed message has been waiting?", "choices": ["NumberOfMessagesSent only", "EC2 CPUUtilization only", "ALB HealthyHostCount", "ApproximateAgeOfOldestMessage"], "answers": ["D"], "explanation": "The age of the oldest message directly indicates consumer backlog delay.", "tip": "Queue latency/backlog questions often point to ApproximateAgeOfOldestMessage.", "multi": false}, {"id": 29, "domain": "Domain 1 — Monitoring, Logging, Analysis, Remediation & Performance Optimization", "prompt": "A production Lambda function is timing out intermittently. The team needs request traces across downstream services to locate latency. Which in-scope AWS service is MOST appropriate?", "choices": ["AWS X-Ray", "Route 53 Resolver", "S3 Inventory", "AWS Backup"], "answers": ["A"], "explanation": "X-Ray provides distributed tracing to analyze request paths and latency across supported services.", "tip": "Distributed request tracing = X-Ray.", "multi": false}, {"id": 30, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "An RDS for MySQL database must automatically fail over to another AZ after infrastructure failure with minimal application changes. Which configuration is BEST?", "choices": ["A larger DB instance in one AZ", "Daily manual snapshots only", "RDS Multi-AZ deployment", "A single Read Replica in the same AZ"], "answers": ["C"], "explanation": "Multi-AZ is the managed high-availability/failover configuration.", "tip": "RDS Multi-AZ = HA; Read Replicas = read scaling.", "multi": false}, {"id": 31, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A reporting workload is overwhelming the read capacity of an RDS MySQL primary. High availability is already handled separately. What should be added?", "choices": ["Read Replica", "Another Multi-AZ standby for reporting reads", "EBS Multi-Attach", "NAT Gateway"], "answers": ["A"], "explanation": "Read replicas offload read-only workloads from the primary.", "tip": "Read scaling = Read Replica.", "multi": false}, {"id": 32, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "An EBS data volume in us-east-1a must be recreated in us-east-1b. What is the correct procedure?", "choices": ["Change the existing volume's AZ", "Attach the existing volume across AZs", "Create a snapshot and create a new volume from the snapshot in us-east-1b", "Change the subnet associated with the volume"], "answers": ["C"], "explanation": "EBS volumes are AZ-scoped; snapshots can create volumes in another AZ.", "tip": "Volume = AZ; snapshot = recovery mechanism.", "multi": false}, {"id": 33, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A company needs automatic replication of new S3 objects to a bucket in another Region. Which TWO configurations are fundamental?", "choices": ["Enable Versioning on source and destination", "Configure S3 Cross-Region Replication", "Enable Transfer Acceleration", "Use an ALB", "Create an Internet Gateway for S3"], "answers": ["A", "B"], "explanation": "S3 CRR performs cross-Region replication and requires versioning on both source and destination.", "tip": "CRR + Versioning.", "multi": true}, {"id": 34, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A production S3 bucket must allow recovery from accidental overwrite and delete operations. There is no WORM requirement. Which feature is MOST direct?", "choices": ["S3 Select", "S3 Versioning", "CloudFront signed URLs", "S3 Transfer Acceleration"], "answers": ["B"], "explanation": "Versioning preserves prior object versions and delete markers.", "tip": "Accidental overwrite/delete recovery = Versioning.", "multi": false}, {"id": 35, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A financial archive requires WORM retention that administrators cannot shorten or bypass during the retention period. Which S3 feature/mode is appropriate?", "choices": ["S3 Object Lock Governance mode only", "S3 Versioning only", "S3 Object Lock Compliance mode", "S3 lifecycle expiration"], "answers": ["C"], "explanation": "Compliance mode provides the stronger immutable retention semantics.", "tip": "WORM with no privileged bypass = Compliance mode.", "multi": false}, {"id": 36, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A DR plan maintains only critical core services and replicated data in the secondary Region. During a disaster, the rest of the environment is provisioned and scaled. Which strategy is this?", "choices": ["Pilot light", "Backup with no running components", "Active/active", "Warm standby"], "answers": ["A"], "explanation": "Pilot light keeps core components ready and scales the remainder after failover.", "tip": "Core running, rest provisioned on disaster = pilot light.", "multi": false}, {"id": 37, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A secondary Region continuously runs a fully functional but reduced-capacity version of the application. During disaster it scales to production capacity. Which strategy?", "choices": ["Single-site", "Backup and restore only", "Warm standby", "Pilot light"], "answers": ["C"], "explanation": "Warm standby is a scaled-down functional environment.", "tip": "Reduced but functional = warm standby.", "multi": false}, {"id": 38, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A business requires the lowest practical RTO and can afford full production capacity in two Regions serving traffic concurrently. Which DR strategy fits?", "choices": ["Multi-site active/active", "Backup and restore", "Cold standby", "Pilot light"], "answers": ["A"], "explanation": "Active/active minimizes failover time but has the highest steady-state cost.", "tip": "Lowest RTO usually means active/active.", "multi": false}, {"id": 39, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "Traffic predictably rises every weekday at 07:45 and drops at 18:30. The ASG should add capacity before the rise. Which scaling approach is BEST?", "choices": ["Target tracking only", "Instance Refresh", "Lifecycle hook", "Scheduled scaling"], "answers": ["D"], "explanation": "Scheduled scaling handles known time-based patterns.", "tip": "Known schedule = scheduled scaling.", "multi": false}, {"id": 40, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "An ASG should automatically keep average CPU near 55% without operators choosing scaling increments. Which policy?", "choices": ["Manual desired capacity", "Step scaling only", "Scheduled scaling", "Target tracking scaling"], "answers": ["D"], "explanation": "Target tracking adjusts capacity to maintain a target metric.", "tip": "Maintain a target = target tracking.", "multi": false}, {"id": 41, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "An ASG should add 1 instance at moderate queue depth, 3 at high queue depth, and 6 at severe queue depth. Which scaling type?", "choices": ["Predictive DNS", "Target tracking", "Step scaling", "Scheduled scaling"], "answers": ["C"], "explanation": "Step scaling supports different adjustments for different breach magnitudes.", "tip": "Threshold bands with different actions = step scaling.", "multi": false}, {"id": 42, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A new launch-template version contains a patched AMI. Existing ASG instances must be gradually replaced while maintaining a minimum healthy percentage. Which feature?", "choices": ["Instance Refresh", "CloudFormation drift detection", "Capacity Reservation", "EBS snapshot copy"], "answers": ["A"], "explanation": "Instance Refresh provides controlled rolling replacement in an ASG.", "tip": "New AMI + existing ASG rolling replacement = Instance Refresh.", "multi": false}, {"id": 43, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "An application process can fail while its EC2 instance remains running. The instances are behind an ALB and in an ASG. What should be configured so Auto Scaling can replace application-unhealthy instances?", "choices": ["Disable ALB health checks", "Use ELB health checks for the ASG", "Use a Route 53 private zone", "Use EC2 status checks only"], "answers": ["B"], "explanation": "ELB health-check integration allows ASG replacement based on application target health.", "tip": "OS alive does not mean app healthy.", "multi": false}, {"id": 44, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A company wants one managed service to define backup schedules, retention, and cross-Region copies for supported AWS resources. Which service?", "choices": ["AWS Backup", "AWS Config", "CloudFront", "CloudTrail"], "answers": ["A"], "explanation": "AWS Backup centralizes backup policies and recovery points for supported resources.", "tip": "Central backup orchestration = AWS Backup.", "multi": false}, {"id": 45, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "An RDS database needs point-in-time recovery to a specific minute within the configured retention period. Which feature is required?", "choices": ["Automated backups", "Read Replica alone", "Multi-AZ alone", "Manual snapshot taken after the incident"], "answers": ["A"], "explanation": "Automated backups and transaction logs enable point-in-time restore.", "tip": "PITR = automated backups/logs.", "multi": false}, {"id": 46, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A Linux application needs a shared POSIX file system that multiple EC2 instances in different AZs can mount concurrently. Which storage service?", "choices": ["Amazon EFS", "S3 Glacier", "Amazon EBS single volume", "EC2 instance store"], "answers": ["A"], "explanation": "EFS provides regional managed shared NFS file storage.", "tip": "Shared Linux file system across AZs = EFS.", "multi": false}, {"id": 47, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "EC2 instances use EFS from three AZs. Only one EFS mount target exists. Which change improves AZ-local connectivity and resilience?", "choices": ["Create mount targets in the required AZs", "Give EFS an Elastic IP", "Put all instances in one AZ", "Use an Internet Gateway"], "answers": ["A"], "explanation": "Creating mount targets in client AZs improves resilient, local access patterns.", "tip": "EFS clients should use appropriately distributed mount targets.", "multi": false}, {"id": 48, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A snapshot-restored EBS volume must provide full expected performance immediately for a latency-sensitive launch. Which capability should be considered?", "choices": ["S3 Transfer Acceleration", "Route 53 failover", "EBS Fast Snapshot Restore", "CloudTrail Insights"], "answers": ["C"], "explanation": "Fast Snapshot Restore creates fully initialized volumes from enabled snapshots in selected AZs.", "tip": "Immediate restored-volume performance = FSR.", "multi": false}, {"id": 49, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "An application requires durable block storage for a single EC2 instance and needs independent IOPS/throughput tuning. Which volume family is a common fit?", "choices": ["EFS One Zone", "S3 Standard", "EBS gp3", "EC2 instance store only"], "answers": ["C"], "explanation": "gp3 is general-purpose EBS block storage with independently configurable IOPS and throughput within limits.", "tip": "General EC2 block storage + tunable performance = gp3.", "multi": false}, {"id": 50, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A company wants to launch the same approved EC2 image in a DR Region. The AMI exists only in the primary Region. What should be done?", "choices": ["Use a NAT Gateway", "Peer the two VPCs only", "Copy the AMI to the DR Region", "Attach the primary Region's AMI through Transit Gateway"], "answers": ["C"], "explanation": "AMIs are Regional resources and can be copied to another Region.", "tip": "DR image availability requires Regional AMI copy.", "multi": false}, {"id": 51, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A web application must continue serving users if one AZ fails. Which THREE choices are MOST appropriate?", "choices": ["Register targets from multiple AZs with an ALB", "Place ASG capacity across multiple AZs", "Use one standalone EC2 instance", "Place all compute in the DB primary AZ", "Use RDS Multi-AZ for the database"], "answers": ["B", "A", "E"], "explanation": "Availability requires redundancy across critical tiers and AZs.", "tip": "Do not leave a hidden single-AZ dependency.", "multi": true}, {"id": 52, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "Private subnets in three AZs require resilient internet egress. Which design avoids making one NAT Gateway/AZ a shared failure dependency?", "choices": ["Deploy a NAT Gateway per AZ and route each private subnet to its local NAT Gateway", "Use one NAT Gateway in one AZ for every subnet", "Route private subnets directly to the IGW", "Assign public IPs to private instances"], "answers": ["A"], "explanation": "Per-AZ NAT Gateways provide AZ-aligned egress resilience.", "tip": "HA NAT design = local NAT per AZ.", "multi": false}, {"id": 53, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "An SQS-backed worker tier receives unpredictable bursts. Which scaling signal most directly represents the work waiting for consumers?", "choices": ["Queue backlog metrics such as visible messages/age", "ALB static IP count", "S3 bucket size", "Route 53 TTL only"], "answers": ["A"], "explanation": "Queue depth and age indicate pending work and can drive consumer scaling.", "tip": "For asynchronous workers, scale on backlog rather than unrelated CPU alone.", "multi": false}, {"id": 54, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "An EC2 workload needs automatic replacement after hardware failure. Which combination is foundational?", "choices": ["Auto Scaling desired capacity plus health checks", "An Elastic IP only", "A larger root volume only", "A single Reserved Instance"], "answers": ["A"], "explanation": "ASG maintains desired capacity and replaces unhealthy instances.", "tip": "Self-healing compute = ASG + health checks.", "multi": false}, {"id": 55, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A cross-Region RDS MySQL Read Replica is promoted during a disaster. Which statement is MOST accurate?", "choices": ["The replica is always the Multi-AZ standby", "Promotion keeps synchronous replication to the old primary automatically", "No DNS/application planning is ever needed", "Promotion is a DR action that should be planned; it is not the same mechanism as automatic Multi-AZ failover"], "answers": ["D"], "explanation": "Cross-Region replica promotion differs from managed Multi-AZ failover and requires DR planning.", "tip": "Do not conflate read replicas with Multi-AZ standby.", "multi": false}, {"id": 56, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A company wants backups protected from application administrators who can modify production resources. Which design best improves recovery-point isolation?", "choices": ["Give application admins backup deletion rights", "Use the same broad admin role for backup deletion", "Use a dedicated backup vault/account strategy with tightly scoped permissions", "Store backups only on instance store"], "answers": ["C"], "explanation": "Separation of duties and restrictive backup-vault permissions reduce the chance an attacker/admin can destroy both production and backups.", "tip": "Backups must be isolated from production blast radius.", "multi": false}, {"id": 57, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "An application stores session state on each EC2 instance and loses sessions whenever Auto Scaling replaces an instance. Which design improves resilience?", "choices": ["Externalize session state to a durable/shared service appropriate to the workload", "Use one permanent instance", "Increase root volume size", "Disable Auto Scaling health checks"], "answers": ["A"], "explanation": "Stateless compute allows replacement and scaling without losing user state.", "tip": "For resilient Auto Scaling, avoid critical local instance state.", "multi": false}, {"id": 58, "domain": "Domain 2 — Reliability & Business Continuity", "prompt": "A workload needs to tolerate an AZ outage, but its database and all NAT egress are still in one AZ. What is the MOST important architectural conclusion?", "choices": ["EBS snapshots make runtime dependencies Multi-AZ", "Route 53 automatically duplicates every dependency", "The design is not truly Multi-AZ because critical dependencies remain single-AZ", "The ASG alone guarantees full AZ resilience"], "answers": ["C"], "explanation": "End-to-end resilience requires every critical dependency to tolerate the failure domain.", "tip": "A Multi-AZ web tier does not fix single-AZ database/network dependencies.", "multi": false}, {"id": 59, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A central platform team must deploy the same CloudFormation baseline to 25 AWS accounts in 3 Regions. Which capability is purpose-built for this?", "choices": ["Drift Detection", "CloudFormation StackSets", "EC2 user data", "CloudFormation Change Sets"], "answers": ["B"], "explanation": "StackSets deploy/manage stacks across multiple accounts and Regions.", "tip": "Multi-account + multi-Region IaC = StackSets.", "multi": false}, {"id": 60, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "Before executing a CloudFormation update, an engineer wants to see which resources will be created, modified, or replaced. Which feature?", "choices": ["Change Set", "CloudTrail Insight", "Drift Detection", "StackSet"], "answers": ["A"], "explanation": "Change Sets preview the effects of a proposed stack update.", "tip": "What WILL change = Change Set.", "multi": false}, {"id": 61, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A CloudFormation-managed security group was manually edited in the console. Which feature identifies the difference from the template?", "choices": ["StackSet", "Change Set", "CreationPolicy", "Drift Detection"], "answers": ["D"], "explanation": "Drift Detection identifies out-of-band changes to supported resources.", "tip": "What HAS drifted = Drift Detection.", "multi": false}, {"id": 62, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A production RDS resource in a CloudFormation stack should be protected from unintended update actions. Which CloudFormation control is relevant?", "choices": ["Route table", "Stack policy", "CloudWatch dashboard", "NACL"], "answers": ["B"], "explanation": "A stack policy can restrict update actions on selected resources.", "tip": "Protect resources during stack updates = stack policy.", "multi": false}, {"id": 63, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "Hundreds of managed EC2 instances need the same diagnostic command executed immediately without SSH. Which Systems Manager capability?", "choices": ["Parameter Store", "Run Command", "Session Manager", "State Manager"], "answers": ["B"], "explanation": "Run Command executes commands remotely across managed nodes.", "tip": "One-to-many remote command = Run Command.", "multi": false}, {"id": 64, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "An administrator needs an interactive shell on an EC2 instance in a private subnet without opening port 22 or managing SSH keys. Which capability?", "choices": ["Patch Manager", "CloudFormation", "Run Command only", "Session Manager"], "answers": ["D"], "explanation": "Session Manager provides IAM-controlled interactive access without inbound SSH.", "tip": "Interactive administration without SSH = Session Manager.", "multi": false}, {"id": 65, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A fleet must continuously ensure a specified agent is installed and a configuration is periodically reapplied. Which SSM capability is BEST?", "choices": ["CloudTrail", "Route 53", "State Manager", "Session Manager"], "answers": ["C"], "explanation": "State Manager maintains desired configuration using associations.", "tip": "Desired state over time = State Manager.", "multi": false}, {"id": 66, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "An operational workflow must snapshot a volume, stop an application, update configuration, restart it, and validate health. Which Systems Manager capability is designed for this?", "choices": ["Parameter Store", "Session Manager", "Automation", "Inventory only"], "answers": ["C"], "explanation": "Automation runbooks orchestrate multi-step operational procedures.", "tip": "Multi-step remediation = SSM Automation.", "multi": false}, {"id": 67, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A company needs centrally controlled OS patch baselines, maintenance execution, and patch compliance reporting for managed nodes. Which capability is MOST relevant?", "choices": ["CloudTrail Lake", "Systems Manager Patch Manager", "Route 53 ARC only", "CloudFront"], "answers": ["B"], "explanation": "Patch Manager automates patch selection/deployment and reports compliance.", "tip": "Patch baselines/compliance = Patch Manager.", "multi": false}, {"id": 68, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "Recurring production maintenance tasks must execute only during approved Saturday windows against tagged managed nodes. Which SSM feature should be used?", "choices": ["Maintenance Windows", "EBS Fast Snapshot Restore", "Route 53 health checks", "S3 lifecycle rules"], "answers": ["A"], "explanation": "Maintenance Windows schedule operational tasks against selected managed targets.", "tip": "Approved recurring ops window = Maintenance Windows.", "multi": false}, {"id": 69, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A non-secret application configuration value must be centrally stored using a hierarchy such as /prod/app/endpoint. Which service is a natural fit?", "choices": ["AWS Shield", "GuardDuty", "CloudTrail", "Systems Manager Parameter Store"], "answers": ["D"], "explanation": "Parameter Store provides hierarchical centralized configuration storage.", "tip": "Hierarchical configuration = Parameter Store.", "multi": false}, {"id": 70, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "An API token must be stored in Parameter Store encrypted with KMS. Which parameter type?", "choices": ["Number", "StringList", "String", "SecureString"], "answers": ["D"], "explanation": "SecureString provides KMS-backed encryption for sensitive Parameter Store values.", "tip": "Encrypted Parameter Store value = SecureString.", "multi": false}, {"id": 71, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "Database credentials require automatic rotation and programmatic retrieval by an application. Which service is the BEST fit?", "choices": ["EC2 user data", "AMI description", "AWS Secrets Manager", "Plain Parameter Store String"], "answers": ["C"], "explanation": "Secrets Manager is purpose-built for secret lifecycle and rotation.", "tip": "Automatic secret rotation = Secrets Manager.", "multi": false}, {"id": 72, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "Every new ASG instance must install a small bootstrap package and register with an internal service during first boot. Which mechanism is simplest?", "choices": ["Route 53 health check", "S3 lifecycle policy", "CloudTrail trail", "Launch-template EC2 user data"], "answers": ["D"], "explanation": "User data is the standard EC2 bootstrap mechanism.", "tip": "First-boot setup = user data.", "multi": false}, {"id": 73, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A company wants immutable EC2 deployments with the OS, security agent, and application already installed and tested before launch. Which artifact should be produced?", "choices": ["A Route 53 record", "A security group", "An Elastic IP", "A versioned AMI"], "answers": ["D"], "explanation": "Prebaked AMIs support repeatable immutable EC2 deployments.", "tip": "Immutable EC2 build = AMI.", "multi": false}, {"id": 74, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "The team wants a managed pipeline to build, test, and distribute hardened EC2 images on a schedule. Which service is specifically intended for this?", "choices": ["EC2 Image Builder", "CloudTrail Lake", "Route 53 Resolver", "S3 Transfer Acceleration"], "answers": ["A"], "explanation": "EC2 Image Builder automates creation, testing, and distribution of images.", "tip": "Automated AMI pipeline = EC2 Image Builder.", "multi": false}, {"id": 75, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "An EC2 application must access S3 without static access keys. Which TWO mechanisms form the recommended credential pattern?", "choices": ["Attach an IAM role through an instance profile", "Allow the SDK to retrieve temporary role credentials from IMDS", "Make the bucket public", "Embed keys in user data", "Create an IAM user and store keys in /etc/profile"], "answers": ["A", "B"], "explanation": "EC2 instance roles provide temporary credentials via the instance metadata service to AWS SDKs.", "tip": "Workload identity = role + temporary credentials.", "multi": true}, {"id": 76, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A command should run only on Systems Manager managed nodes tagged PatchGroup=Critical. What is the MOST scalable targeting method?", "choices": ["Target the operation by tags/resource groups", "Use Route 53 weighted records", "Open SSH and loop manually", "Maintain a spreadsheet of instance IDs"], "answers": ["A"], "explanation": "SSM supports dynamic target selection by tags/resource groups.", "tip": "Fleet operations should use dynamic targeting.", "multi": false}, {"id": 77, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A team wants reusable, version-controlled operational procedures that can be executed consistently by automation. Which construct should it standardize?", "choices": ["Systems Manager documents/runbooks", "Security group descriptions", "S3 ACLs", "Route table names"], "answers": ["A"], "explanation": "SSM documents define reusable commands and automation workflows.", "tip": "Operational procedure as code = SSM document/runbook.", "multi": false}, {"id": 78, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A CloudFormation update fails while modifying several resources. What native behavior is intended to return the stack toward its previous stable state?", "choices": ["CloudFront invalidation", "S3 replication", "VPC peering", "Rollback"], "answers": ["D"], "explanation": "CloudFormation rollback handles failed stack operations subject to resource/update behavior.", "tip": "Failed stack update = understand rollback.", "multi": false}, {"id": 79, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A large CloudFormation application wants to reuse a standard networking component as a modular child template. Which pattern?", "choices": ["NAT instances", "Nested stacks", "S3 Inventory", "CloudTrail Insights"], "answers": ["B"], "explanation": "Nested stacks support modular composition and reuse.", "tip": "CloudFormation modularization = nested stacks.", "multi": false}, {"id": 80, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "CloudFormation launches an instance that requires 12 minutes of bootstrap before the dependent resource should proceed. The stack needs a success signal from the bootstrap process. Which mechanism is relevant?", "choices": ["Route 53 geolocation", "NACL deny rule", "S3 Object Lock", "CreationPolicy/resource signaling where supported"], "answers": ["D"], "explanation": "CloudFormation supports resource signaling patterns to coordinate bootstrap completion.", "tip": "IaC must sometimes wait for successful bootstrap, not just instance launch.", "multi": false}, {"id": 81, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "On-premises Linux servers must be patched and operated through Systems Manager alongside EC2. What must be configured?", "choices": ["Give them public S3 buckets", "Create ALB target groups only", "Register/configure them as Systems Manager managed nodes using the supported hybrid mechanism", "Convert them into EBS volumes"], "answers": ["C"], "explanation": "Systems Manager supports hybrid managed nodes when properly registered and connected.", "tip": "SSM can manage hybrid servers; they must become managed nodes.", "multi": false}, {"id": 82, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "An ECS application should run containers without the company managing EC2 worker instances. Which compute option is BEST?", "choices": ["EC2 Dedicated Hosts only", "AWS Fargate", "CloudFront Functions", "Amazon S3"], "answers": ["B"], "explanation": "Fargate provides managed serverless compute for supported container workloads.", "tip": "Containers without host management = Fargate.", "multi": false}, {"id": 83, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A container image is stored in Amazon ECR. Which service is responsible for maintaining a desired number of running application tasks in an ECS service?", "choices": ["Amazon Athena", "AWS Backup", "Amazon ECR", "Amazon ECS"], "answers": ["D"], "explanation": "ECR stores images; ECS schedules and manages tasks/services.", "tip": "ECR stores; ECS orchestrates.", "multi": false}, {"id": 84, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A deployment maintains an old production environment and a separate new environment, validates the new version, then switches traffic. Which deployment strategy?", "choices": ["In-place only", "Pilot light", "Read replication", "Blue/green"], "answers": ["D"], "explanation": "Blue/green uses separate environments and a traffic cutover.", "tip": "Separate old/new + cutover = blue/green.", "multi": false}, {"id": 85, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A team needs an event-driven workflow with branching, retries, and several AWS API/service steps. It is more application workflow than server administration. Which service should be considered?", "choices": ["Route 53", "Systems Manager Session Manager", "EBS", "AWS Step Functions"], "answers": ["D"], "explanation": "Step Functions orchestrates event-driven application/service workflows with state, retries, and branching.", "tip": "Workflow orchestration vs server runbook: Step Functions is often the app/service workflow choice.", "multi": false}, {"id": 86, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "An EventBridge rule receives a scheduled event and must fan out a notification to several subscribed endpoints. Which service is the natural fan-out target?", "choices": ["AWS WAF", "Amazon SNS", "Route 53 Resolver", "Amazon EBS"], "answers": ["B"], "explanation": "SNS provides pub/sub fan-out to multiple subscribers.", "tip": "One event → many notifications = SNS.", "multi": false}, {"id": 87, "domain": "Domain 3 — Deployment, Provisioning & Automation", "prompt": "A queue-based application must ensure messages remain available while workers are temporarily unavailable. Which service characteristic is being used?", "choices": ["Route 53 geolocation", "Amazon SQS decoupling and durable message buffering", "EBS Multi-Attach", "ALB sticky sessions"], "answers": ["B"], "explanation": "SQS buffers messages between producers and consumers, reducing temporal coupling.", "tip": "Decoupling/buffering = SQS.", "multi": false}, {"id": 88, "domain": "Domain 4 — Security & Compliance", "prompt": "An internet-facing ALB application must block common SQL injection and cross-site scripting attempts. Which service should be associated with the application?", "choices": ["AWS Config", "AWS WAF", "Amazon GuardDuty", "Amazon Inspector"], "answers": ["B"], "explanation": "WAF filters HTTP(S) requests using managed/custom rules.", "tip": "SQLi/XSS at HTTP layer = WAF.", "multi": false}, {"id": 89, "domain": "Domain 4 — Security & Compliance", "prompt": "A business-critical public application wants enhanced DDoS protections and AWS DDoS response capabilities beyond standard protections. Which service should be evaluated?", "choices": ["AWS Shield Advanced", "Amazon Inspector", "AWS WAF only", "AWS Secrets Manager"], "answers": ["A"], "explanation": "Shield Advanced provides enhanced DDoS protections and associated features/support.", "tip": "DDoS = Shield; web request filtering = WAF.", "multi": false}, {"id": 90, "domain": "Domain 4 — Security & Compliance", "prompt": "Security must continuously identify known software vulnerabilities and CVEs on supported EC2 workloads and ECR images. Which service?", "choices": ["AWS Security Hub only", "Amazon Inspector", "Amazon GuardDuty", "CloudTrail"], "answers": ["B"], "explanation": "Inspector provides vulnerability management for supported compute/container artifacts.", "tip": "CVE scanning = Inspector.", "multi": false}, {"id": 91, "domain": "Domain 4 — Security & Compliance", "prompt": "Security wants managed detection of suspicious activity using AWS telemetry such as CloudTrail events, DNS activity, and VPC-related signals. Which service?", "choices": ["Amazon Inspector", "CloudFormation", "Amazon GuardDuty", "AWS Backup"], "answers": ["C"], "explanation": "GuardDuty is AWS managed threat detection.", "tip": "Suspicious behavior/threat detection = GuardDuty.", "multi": false}, {"id": 92, "domain": "Domain 4 — Security & Compliance", "prompt": "A security account must aggregate findings from services such as GuardDuty and Inspector into a central security posture view. Which service?", "choices": ["AWS Shield", "CloudWatch Synthetics", "S3 Transfer Acceleration", "AWS Security Hub"], "answers": ["D"], "explanation": "Security Hub centralizes security findings/posture from integrated services.", "tip": "Central findings = Security Hub.", "multi": false}, {"id": 93, "domain": "Domain 4 — Security & Compliance", "prompt": "An S3 bucket must not become public even if someone later adds a public ACL or bucket policy. Which preventive control should be enabled?", "choices": ["CloudFront", "S3 Transfer Acceleration", "S3 Block Public Access", "S3 Inventory"], "answers": ["C"], "explanation": "Block Public Access provides preventive controls against common public-access configurations.", "tip": "Prevent public S3 = Block Public Access.", "multi": false}, {"id": 94, "domain": "Domain 4 — Security & Compliance", "prompt": "AWS Organizations must prevent member-account administrators from deleting CloudTrail trails, even if their IAM policies allow it. Which control is appropriate?", "choices": ["A route table", "An SCP with an explicit Deny for the relevant actions", "A security group", "An IAM Allow policy"], "answers": ["B"], "explanation": "SCPs constrain maximum permissions in member accounts; explicit Deny cannot be overridden by local IAM Allow.", "tip": "Organization guardrail = SCP.", "multi": false}, {"id": 95, "domain": "Domain 4 — Security & Compliance", "prompt": "An IAM role has Allow s3:* but an applicable SCP explicitly denies s3:DeleteObject. What is the result?", "choices": ["SCPs apply only to billing", "DeleteObject is denied", "AWS evaluates the policies randomly", "DeleteObject is allowed because the role policy is broader"], "answers": ["B"], "explanation": "An applicable explicit Deny overrides Allow.", "tip": "Explicit Deny wins.", "multi": false}, {"id": 96, "domain": "Domain 4 — Security & Compliance", "prompt": "An EC2 workload needs access to DynamoDB and S3. The company prohibits long-lived access keys. What is the BEST identity design?", "choices": ["Use the root user's access key", "Make both resources public", "Use an IAM role for the EC2 instance with least-privilege permissions", "Store IAM user keys in user data"], "answers": ["C"], "explanation": "EC2 roles supply temporary credentials and avoid long-lived secrets.", "tip": "AWS workload credentials should be role-based.", "multi": false}, {"id": 97, "domain": "Domain 4 — Security & Compliance", "prompt": "A secret is encrypted with a customer-managed KMS key. The application role can call Secrets Manager GetSecretValue but receives an AccessDenied related to KMS. What should be checked?", "choices": ["The role/key policy authorization for kms:Decrypt", "The ALB listener rule", "The Route 53 TTL", "The subnet's DHCP options only"], "answers": ["A"], "explanation": "Access to the secret and permission to use its KMS key are separate authorization checks.", "tip": "KMS key authorization is a separate layer.", "multi": false}, {"id": 98, "domain": "Domain 4 — Security & Compliance", "prompt": "A company wants customer control over the key policy for S3 server-side encryption. Which option is MOST appropriate?", "choices": ["SSE-KMS with a customer managed KMS key", "SSE-S3 only", "Base64 encoding", "No encryption with HTTPS"], "answers": ["A"], "explanation": "A customer-managed KMS key provides customer-controlled key policies and lifecycle controls.", "tip": "Customer-managed encryption permissions = customer managed KMS key.", "multi": false}, {"id": 99, "domain": "Domain 4 — Security & Compliance", "prompt": "AWS Config identifies an S3 bucket as noncompliant. The company wants AWS to invoke a predefined SSM Automation remediation automatically. Which TWO capabilities are required?", "choices": ["AWS Config automatic remediation integrated with SSM Automation", "NAT Gateway", "AWS Config rule/evaluation", "CloudFront Function", "EBS snapshot"], "answers": ["C", "A"], "explanation": "Config evaluates compliance and can trigger SSM Automation remediation.", "tip": "Compliance detection + automated fix = Config + SSM Automation.", "multi": true}, {"id": 100, "domain": "Domain 4 — Security & Compliance", "prompt": "Administrators require audited interactive access to private EC2 instances without opening inbound SSH and without SSH keys. Which service?", "choices": ["EC2 public IP plus SSH", "NAT Gateway", "Systems Manager Session Manager", "Route 53 Resolver"], "answers": ["C"], "explanation": "Session Manager provides IAM-controlled interactive access and supports logging/auditing configurations.", "tip": "No inbound SSH + interactive admin = Session Manager.", "multi": false}, {"id": 101, "domain": "Domain 4 — Security & Compliance", "prompt": "A team wants to refine an IAM role toward least privilege by analyzing access and policy usage. Which IAM service/capability should be considered?", "choices": ["CloudFront", "AWS Shield", "EBS Fast Snapshot Restore", "IAM Access Analyzer"], "answers": ["D"], "explanation": "IAM Access Analyzer supports access analysis and policy refinement capabilities.", "tip": "Least-privilege IAM analysis = Access Analyzer.", "multi": false}, {"id": 102, "domain": "Domain 4 — Security & Compliance", "prompt": "A sensitive S3 bucket must reject requests that do not use TLS. Which policy is MOST appropriate?", "choices": ["S3 lifecycle rule", "Bucket policy with explicit Deny when aws:SecureTransport is false", "Security group on the S3 bucket", "NACL attached to S3"], "answers": ["B"], "explanation": "An S3 bucket policy condition can enforce secure transport.", "tip": "S3 has no security group; enforce TLS with bucket policy.", "multi": false}, {"id": 103, "domain": "Domain 4 — Security & Compliance", "prompt": "A company wants centralized AWS Config compliance data across many accounts and Regions. Which feature?", "choices": ["S3 Transfer Acceleration", "AWS Config aggregator", "CloudFront origin group", "EBS Multi-Attach"], "answers": ["B"], "explanation": "Config aggregators centralize configuration/compliance data.", "tip": "Central Config visibility = aggregator.", "multi": false}, {"id": 104, "domain": "Domain 4 — Security & Compliance", "prompt": "An IAM permissions boundary permits only read actions. An identity policy attached to the role allows s3:DeleteObject. Assuming no other applicable grants, can the role delete objects?", "choices": ["Yes; S3 ignores permissions boundaries", "Only if the bucket is versioned", "Yes; identity policies override boundaries", "No; the permissions boundary caps the role's effective identity permissions"], "answers": ["D"], "explanation": "Permissions boundaries define the maximum permissions available through identity policies.", "tip": "Boundary = maximum permission envelope.", "multi": false}, {"id": 105, "domain": "Domain 4 — Security & Compliance", "prompt": "A security team discovers a database credential was written into a CloudWatch log event. What should be done FIRST from a credential-security perspective?", "choices": ["Only encrypt the log group and keep the credential", "Disable CloudTrail", "Rotate/revoke the exposed credential and stop the application from logging it", "Make the log group public for investigation"], "answers": ["C"], "explanation": "Once a credential is exposed to logs, encryption does not undo exposure to authorized readers; rotate it and prevent recurrence.", "tip": "Exposed secret = rotate/revoke.", "multi": false}, {"id": 106, "domain": "Domain 4 — Security & Compliance", "prompt": "A company wants CloudTrail logs protected from the same administrators who manage production workloads. Which TWO controls best improve separation and integrity?", "choices": ["Store the only copy on instance store", "Allow workload admins to delete audit logs", "Centralize logs in a dedicated tightly controlled account/bucket", "Use restrictive S3/KMS policies and CloudTrail log-file validation where required", "Disable logging during deployments"], "answers": ["C", "D"], "explanation": "Centralized logging plus restrictive access/integrity controls reduces tampering risk.", "tip": "Audit logs should be outside the workload-admin blast radius.", "multi": true}, {"id": 107, "domain": "Domain 4 — Security & Compliance", "prompt": "An organization must enforce that workloads are deployed only in approved AWS Regions. Which governance layer can provide a preventive organization-level guardrail?", "choices": ["ALB target groups", "S3 lifecycle rules", "CloudWatch dashboards", "AWS Organizations SCPs with appropriate Region restrictions"], "answers": ["D"], "explanation": "SCPs can provide organization-level preventive permission guardrails, including Region restrictions with required exceptions.", "tip": "Preventive organization-wide restrictions = SCP.", "multi": false}, {"id": 108, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "EC2 instances in private subnets need private access to Amazon S3 without NAT Gateway data processing or internet traversal. Which solution is MOST cost-effective?", "choices": ["Assign public IPv4 addresses", "Create a NAT Gateway only", "Use an ALB", "Create an S3 Gateway VPC Endpoint and update route tables/policies appropriately"], "answers": ["D"], "explanation": "S3 supports Gateway VPC Endpoints, providing private access without NAT.", "tip": "S3/DynamoDB are key Gateway Endpoint services.", "multi": false}, {"id": 109, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "Private EC2 instances need to call Secrets Manager without using NAT or the public internet. Which VPC feature is appropriate?", "choices": ["An Internet Gateway", "An Interface VPC Endpoint for Secrets Manager", "An S3 Gateway Endpoint", "A public ALB"], "answers": ["B"], "explanation": "PrivateLink/interface endpoints provide private access to supported AWS service APIs such as Secrets Manager.", "tip": "Most service API private endpoints = Interface Endpoint.", "multi": false}, {"id": 110, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "A private subnet has 0.0.0.0/0 pointing to a public NAT Gateway, but instances still cannot reach the internet. Which NAT-side configuration is required?", "choices": ["The private subnet must route directly to the IGW", "The private instances need public IPs", "The NAT Gateway must be attached to each ENI", "The NAT Gateway's public subnet needs a route to an attached Internet Gateway"], "answers": ["D"], "explanation": "A public NAT Gateway needs public-subnet Internet Gateway connectivity.", "tip": "Private → NAT; NAT public subnet → IGW.", "multi": false}, {"id": 111, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "An organization has 60 VPCs and several on-premises networks. It wants centralized hub-and-spoke routing rather than a mesh of peering connections. Which service?", "choices": ["AWS Transit Gateway", "NAT Gateway", "CloudFront", "Internet Gateway"], "answers": ["A"], "explanation": "Transit Gateway provides scalable centralized routing for many VPCs and hybrid connections.", "tip": "Many networks + hub = Transit Gateway.", "multi": false}, {"id": 112, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "Only two VPCs require private connectivity, their CIDRs do not overlap, and no expansion is expected. Which solution is typically the simplest?", "choices": ["CloudFront", "VPC Peering", "Transit Gateway is mandatory", "NAT Gateway"], "answers": ["B"], "explanation": "VPC peering is simple for small point-to-point VPC connectivity.", "tip": "Two VPCs only = peering is often simplest.", "multi": false}, {"id": 113, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "An application needs HTTP host-based and path-based routing to different target groups. Which load balancer is appropriate?", "choices": ["Application Load Balancer", "NAT Gateway", "Gateway endpoint", "Network Load Balancer"], "answers": ["A"], "explanation": "ALB provides Layer 7 host/path routing.", "tip": "HTTP path/host routing = ALB.", "multi": false}, {"id": 114, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "A TCP service requires very high connection scale and static IP addresses per enabled AZ. Which load balancer is the BEST fit?", "choices": ["Network Load Balancer", "CloudFront only", "Route 53 Resolver", "Application Load Balancer"], "answers": ["A"], "explanation": "NLB provides Layer 4 load balancing and static-IP characteristics.", "tip": "TCP + static IP = NLB.", "multi": false}, {"id": 115, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "A global application needs static anycast IPs and acceleration for TCP traffic over the AWS global network. It does not need caching. Which service?", "choices": ["NAT Gateway", "AWS Global Accelerator", "Amazon CloudFront", "S3 Transfer Acceleration"], "answers": ["B"], "explanation": "Global Accelerator provides static anycast IPs and accelerates TCP/UDP application traffic without CDN caching.", "tip": "Acceleration without caching = Global Accelerator.", "multi": false}, {"id": 116, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "A website needs edge caching of static and dynamic web content with an ALB as origin. Which service is the natural fit?", "choices": ["Transit Gateway", "NAT Gateway", "VPC Peering", "Amazon CloudFront"], "answers": ["D"], "explanation": "CloudFront is AWS's CDN and can use an ALB as an origin.", "tip": "Edge caching/CDN = CloudFront.", "multi": false}, {"id": 117, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "Route 53 should send users to the AWS Region that provides the lowest network latency and avoid unhealthy endpoints. Which TWO capabilities should be combined?", "choices": ["Geolocation routing only", "Latency-based routing", "Weighted routing only", "Resolver outbound endpoint", "Route 53 health evaluation/health checks as applicable"], "answers": ["B", "E"], "explanation": "Latency routing optimizes by measured network latency; health evaluation avoids unhealthy endpoints.", "tip": "Lowest latency is not the same as geographic location.", "multi": true}, {"id": 118, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "A company wants to send approximately 5% of DNS responses to a new deployment and 95% to the stable deployment. Which Route 53 policy?", "choices": ["Weighted routing", "Latency routing", "Geolocation routing", "Failover routing only"], "answers": ["A"], "explanation": "Weighted records support relative traffic distribution.", "tip": "Percentage DNS split = weighted.", "multi": false}, {"id": 119, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "A DR design requires a primary DNS endpoint and a secondary endpoint that is returned when the primary is unhealthy. Which Route 53 policy?", "choices": ["Geolocation routing", "Failover routing", "Weighted routing", "Latency routing"], "answers": ["B"], "explanation": "Failover routing implements active/passive DNS behavior.", "tip": "Primary/secondary = failover routing.", "multi": false}, {"id": 120, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "A media company must serve different endpoints based on the user's country because of licensing restrictions. Which Route 53 policy?", "choices": ["Simple routing", "Weighted routing", "Latency routing", "Geolocation routing"], "answers": ["D"], "explanation": "Geolocation routes according to the geographic origin of DNS queries.", "tip": "Country/continent = geolocation.", "multi": false}, {"id": 121, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "An EC2 security group allows outbound HTTPS. Return packets for that established connection are allowed even without an explicit inbound rule. Why?", "choices": ["NACLs are stateful", "Internet Gateways add inbound SG rules", "Security groups are stateful", "Route tables track TCP sessions"], "answers": ["C"], "explanation": "Security groups automatically allow response traffic for allowed connections.", "tip": "SG = stateful.", "multi": false}, {"id": 122, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "A subnet NACL allows outbound HTTPS but does not permit required return ephemeral ports. Connections fail. Which property explains the behavior?", "choices": ["NACLs are stateless", "Route 53 blocks ephemeral ports", "Security groups are stateless", "ALBs require UDP"], "answers": ["A"], "explanation": "NACLs evaluate traffic independently in each direction.", "tip": "NACL = stateless; permit both directions.", "multi": false}, {"id": 123, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "An ALB must terminate HTTPS with an AWS-managed public certificate and redirect HTTP requests to HTTPS. Which TWO configurations are appropriate?", "choices": ["Use Route 53 Resolver for TLS", "Configure the HTTP listener to redirect to HTTPS", "Attach an ACM certificate to the HTTPS listener", "Put a certificate on the NAT Gateway", "Disable port 443"], "answers": ["C", "B"], "explanation": "ACM integrates with ALB TLS listeners, and ALB listeners can redirect HTTP to HTTPS.", "tip": "ALB TLS = ACM + HTTPS listener; redirect at listener.", "multi": true}, {"id": 124, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "AWS Direct Connect is the primary hybrid path. The company needs an encrypted backup connection over the public internet. Which service?", "choices": ["AWS Site-to-Site VPN", "S3 Gateway Endpoint", "NAT Gateway", "CloudFront"], "answers": ["A"], "explanation": "Site-to-Site VPN provides IPsec connectivity over the internet and can back up Direct Connect.", "tip": "DX backup over internet = Site-to-Site VPN.", "multi": false}, {"id": 125, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "VPC workloads must resolve names in an on-premises DNS domain by forwarding queries to on-prem DNS servers. Which Route 53 Resolver component is required?", "choices": ["CloudFront distribution", "Public hosted zone only", "Inbound endpoint only", "Outbound endpoint with forwarding rules"], "answers": ["D"], "explanation": "Outbound Resolver endpoints forward VPC-originated DNS queries to external resolvers.", "tip": "VPC → on-prem DNS = outbound.", "multi": false}, {"id": 126, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "On-premises clients need to resolve names in Route 53 private hosted zones associated with a VPC. Which component should receive their DNS queries?", "choices": ["NAT Gateway", "Resolver outbound endpoint only", "CloudFront", "Route 53 Resolver inbound endpoint"], "answers": ["D"], "explanation": "Inbound endpoints receive DNS queries from on-premises networks for AWS/VPC resolution.", "tip": "On-prem → AWS DNS = inbound.", "multi": false}, {"id": 127, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "Two EC2 instances cannot communicate. The team wants to determine whether configuration permits the path and then inspect observed ACCEPT/REJECT traffic. Which TWO tools should it use?", "choices": ["CloudTrail data events", "Amazon Inspector", "S3 Inventory", "Reachability Analyzer", "VPC Flow Logs"], "answers": ["D", "E"], "explanation": "Reachability Analyzer evaluates the configured path; Flow Logs provide observed flow metadata.", "tip": "Path logic + observed traffic = Reachability Analyzer + Flow Logs.", "multi": true}, {"id": 128, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "A three-tier application should permit internet traffic only to the ALB, ALB traffic to application instances, and application traffic to the database. Which design is BEST?", "choices": ["Make the database public", "Use only one broad NACL", "Use separate security groups and reference the upstream tier's SG as the source for the next tier", "Allow 0.0.0.0/0 to all three tiers"], "answers": ["C"], "explanation": "Security-group references provide least-privilege tier-to-tier access without hard-coded instance IPs.", "tip": "Internet → ALB SG → App SG → DB SG.", "multi": false}, {"id": 129, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "A Route 53 alias record points to an ALB. Which benefit distinguishes an alias from a traditional CNAME at the zone apex?", "choices": ["Alias records require a public EC2 IP", "An alias can be used at the zone apex for supported AWS targets", "A CNAME is required at the zone apex", "Alias records disable health evaluation"], "answers": ["B"], "explanation": "Route 53 alias records can target supported AWS resources and can be used at the zone apex.", "tip": "Zone apex + AWS target = Route 53 alias.", "multi": false}, {"id": 130, "domain": "Domain 5 — Networking & Content Delivery", "prompt": "A company wants private connectivity from a VPC to a service exposed by another VPC without full network-level peering and with service-provider/consumer separation. Which AWS networking capability is designed for this pattern?", "choices": ["S3 Gateway Endpoint", "Internet Gateway", "Route 53 geolocation", "AWS PrivateLink using interface endpoints and an endpoint service"], "answers": ["D"], "explanation": "PrivateLink exposes services privately to consumers through interface endpoints without broad VPC peering.", "tip": "Private service exposure, not full VPC routing = PrivateLink.", "multi": false}];</script><script>
const BANK=QUESTION_BANK,KEY='soaC03RealisticSetE';let st=JSON.parse(localStorage.getItem(KEY)||'{}');st.a=st.a||{};

let rows=Object.entries(dom).map(([d,v])=>`<tr><td>${d}</td><td>${v.c}/${v.n}</td><td>${(100*v.c/v.n).toFixed(1)}%</td></tr>`).join('');document.getElementById('domains').innerHTML=`<table><tr><th>Domain</th><th>Correct</th><th>%</th></tr>${rows}</table>`;
